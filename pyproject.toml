[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sts-rl"
version = "0.1.0"
description = "Headless STS1 Ironclad combat simulator; A: Set Transformer + PPO vs B: Decision Transformer"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    # D25 将最小切片 PPO+MLP 冒烟前移；Set Transformer 仍按后续阶段实现。
    "torch>=2.6,<3",
    "tensorboard>=2.18,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["sts", "sts.*"]
